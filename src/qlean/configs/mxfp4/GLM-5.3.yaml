quant_stage:
  quantization_modifiers:
    GeneralQuantEngineModifier:
      num_gpus: 0
      resume: true
      force_rerun: false

      primary_scheme: MXFP4
      config_writer: compressed_tensors
      sglang_wa: auto
      dequant_block_size: 128
      dequant_dtype: fp32

      regions:
        - name: experts
          match: "*.experts.*_proj.weight"
          src: FP8_Block
          when: has_source_scale
          dst: MXFP4

        - name: dense
          match: "*.weight"
          src: FP8_Block
          when: has_source_scale
          dst: FP8_DYNAMIC

        - name: fallback
          match: "*"
